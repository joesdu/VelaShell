# PR / 推送门禁:构建 + 全量测试。发布流水线(release.yml)只在 publish Release 时跑,
# 在此之前没有任何自动检查 —— 包括 Dependabot 开的依赖升级 PR,合进来之前没人跑过一次测试。
#
# 几处刻意的选择,改之前先读:
#   * 用 **Debug**:强名签名只在 Release 打开(src/Directory.Build.props),Debug 不需要
#     VelaShell.snk。fork 与 Dependabot 的 PR 拿不到仓库 secret,用 Release 会直接构建失败。
#   * 排除 DockerIntegration / CrossPlatform / Interop:DockerIntegration 要 Docker 守护进程,
#     CrossPlatform 要 VELASHELL_PUBLISH_TESTS=1,Interop 要一台真 sshd
#     (本地用 scripts/ssh/interop/ 起)。没有环境时它们会 Assert.Inconclusive(如实记为跳过),
#     在 CI 上跑一遍只是白花时间,不跑也不会掩盖什么。
#   * **本仓检出在 VelaShell/ 子目录**:文档仓库要与它并排(velashell-docs/),
#     快捷键总表与《快捷键参考》的比对用例才找得到。所以各步都带 working-directory。
#   * 矩阵带上 ubuntu:本进程内的 UI 测试走 Avalonia.Headless 不需要显示服务器,顺带把
#     #if LINUX 的 UseWayland 分支也编译到 —— 那段代码在 Windows 上永远编译不到,回归了
#     也看不见。唯一例外是隔离插件拉起的 PluginHost 子进程(见下方 matrix 的 launcher)。
#   * -warnaserror:当前基线就是 0 警告,守住它。
#   * **不加** dotnet format --verify-no-changes:CRLF 工作树与 end_of_line = lf 的
#     .editorconfig 会产生十几万条 ENDOFLINE 噪音,先把换行统一了再加这一步。
#   * Linux 上多编一遍 runtime-async=off,专扫 Span / ref struct 跨 await(CS4007),理由见那一步。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新推送会取消上一次还在跑的检查:PR 连推几次时不必把 runner 全占满。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 构建与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂掉不影响另一个继续跑完 —— 平台相关的回归要能一次看全。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            launcher: ""
          # 隔离插件测试要拉起真正的 PluginHost 子进程,那是个 Avalonia.Desktop 程序:
          # Linux 上 UsePlatformDetect 落到 X11,没有显示服务器就 XOpenDisplay failed
          # 直接 abort(退出码 134),插件连管道都来不及连。本进程内的 UI 测试走
          # Avalonia.Headless 不受影响,子进程不吃这套 —— 给它一块虚拟屏。
          # 短命的 X11 客户端之间可能暂时没有连接;禁止此时重置显示,避免下一个
          # PluginHost 撞上重置窗口。Xvfb 错误写入作业日志,不再默认丢到 /dev/null。
          - os: ubuntu-latest
            launcher: 'xvfb-run -a -e /dev/stderr -s "-screen 0 1280x1024x24 -noreset"'
          # macOS 上路径、进程与文件系统的行为都自成一套(大小写不敏感但保留大小写的卷、
          # 应用包结构、`open -a` 起编辑器、区分 /tmp 与 /private/tmp 的真实路径)。
          # release.yml 早就在 macos-latest 上完整构建并打包 osx-x64/osx-arm64,
          # 但那要等到 publish Release 才跑 —— 在此之前 macOS 上的回归无人拦截。
          # runner 是带图形会话的真机,PluginHost 子进程不需要额外的虚拟屏。
          - os: macos-latest
            launcher: ""
    steps:
      - uses: actions/checkout@v7
        with:
          path: VelaShell

      # 快捷键总表与文档仓库里那份《快捷键参考》要逐条对齐,把关的用例是
      # ShortcutCatalogTests.Doc_ListsEveryCatalogEntry —— 文档在另一个仓库,拿不到就
      # Assert.Inconclusive(如实记为跳过)。不检出它,这条用例在 CI 上永远不跑,
      # 那份文档里"由本用例把关"的承诺就是空的。
      #
      # continue-on-error:文档仓库私有、改名或临时不可达时,门禁不该因此拦下代码 PR。
      # 检出失败的后果是那条用例回到"跳过",报告里看得见 —— 不是伪通过。
      #
      # 检出哪个分支:改了快捷键的代码 PR,对应的文档改动在 velashell-docs 的另一个 PR 里,
      # 两个 PR 一起合(AGENTS.md 第二条)。文档仓库的默认分支在合并前还是旧的,比对用例必然红
      # —— #554 就卡在这。所以 PR 正文引用了一个还开着的文档 PR(`velashell-docs#83` 或它的链接)时,
      # 检出那个 PR 的分支;没引用、都已合并或关闭时照旧用默认分支。推送到 main 的检查没有 PR 正文,
      # 用默认分支 —— 所以两个 PR 先合文档、再合代码。
      # 正文是 PR 作者写的任意文本:经环境变量传入、只从里面抽数字,不拼进脚本;
      # 只认文档仓库自己的分支,不检出 fork。这一步失败同样不拦 PR,退回默认分支。
      - name: 定位文档分支
        id: docsref
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          numbers=$(printf '%s' "$PR_BODY" | grep -oE 'velashell-docs(#|/pull/)[0-9]+' | grep -oE '[0-9]+$' | awk '!seen[$0]++' || true)
          for number in $numbers; do
            # 查询失败(号码不存在、限流)时 gh 会把错误响应打到 stdout,不能当成结果读。
            if ! info=$(gh api "repos/VelaShellLabs/velashell-docs/pulls/$number" --jq '[.state, .head.repo.full_name, .head.ref] | @tsv' 2>/dev/null); then
              info=""
            fi
            IFS=$'\t' read -r state repo ref <<< "$info"
            if [ "$state" = "open" ] && [ "$repo" = "VelaShellLabs/velashell-docs" ]; then
              echo "检出文档 PR #$number 的分支 $ref。"
              echo "ref=$ref" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "文档 PR #$number:状态 ${state:-未知},来源 ${repo:-未知},跳过。"
          done
          echo "没有引用开着的文档 PR,用文档仓库的默认分支。"

      - name: 检出文档仓库
        id: docs
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: VelaShellLabs/velashell-docs
          # dev 分支与宿主同步推进时，文档改动也落在 velashell-docs/dev；否则手动触发
          # dev CI 会检出默认 main，看不到刚补的快捷键表。main 仍使用文档默认分支。
          ref: ${{ steps.docsref.outputs.ref || (github.ref_name == 'dev' && 'dev' || '') }}
          path: velashell-docs

      # runner 镜像通常已带这些,列全是为了镜像换代时不至于悄悄少一个。
      # libxcb / libxkbcommon / libxkbcommon-x11 是 LinuxKeymap 从 $DISPLAY 读桌面布局用的,xvfb 不会带上后两个;
      # 缺了 HostKeymap_BuildsFromTheCurrentSystemLayout 只能记为跳过,Linux 上的布局跟随就没人验。
      #
      # 一个都不缺时**连 apt 都不碰**。镜像里还配着 Chrome 等第三方源,它们的索引偶尔会
      # Hash Sum mismatch,而 `apt-get update` 只要有一个源没取下来就整体退 100 ——
      # 本仓被它拦下过一次(run 34384262772:Linux 作业连编译都没跑到,见 plan.md §62)。
      # 真缺包时才更新索引,且更新失败只记一行:要装的包全在 Ubuntu 主仓,第三方源坏掉不该
      # 拦下代码 PR;真装不上的话,下面这条 install 会如实失败 —— 判据在装,不在索引。
      - name: 安装虚拟显示 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packages=(xvfb libx11-6 libice6 libsm6 libfontconfig1 libxcb1 libxkbcommon0 libxkbcommon-x11-0)
          missing=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed' || missing+=("$package")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "镜像已带齐:${packages[*]}"
            exit 0
          fi
          echo "缺少:${missing[*]}"
          sudo apt-get update || echo "::warning::apt-get update 有源没取下来,继续尝试安装。"
          sudo apt-get install -y --no-install-recommends "${missing[@]}"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-quality: preview
          dotnet-version: |
            11.0.x

      # 仓库不用 global.json 钉 SDK:用的是 runner 上装到的最新 11.0 预览版。把实际版本记进日志,
      # 换了 SDK 之后构建或测试结果变了,一眼就能对上是哪一版。
      - name: 记录 SDK 版本
        run: dotnet --info

      - name: 构建
        id: build
        working-directory: VelaShell
        run: dotnet build VelaShell.slnx -c Debug --nologo -warnaserror

      # 环境缺失的用例现在一律 Assert.Inconclusive(如实记为「跳过」),不再是
      # 「写一行 [SKIP] 日志然后 return」那种在报告里显示为通过的伪装。
      # 所以这里的过滤只是省时间,不再兼着"掩盖伪通过"的作用。
      # AI 插件的三组 headless UI 用例各起一个进程并行跑;Windows 先跑完其余测试,理由见脚本开头。
      # shell 写死 bash:Windows 上是 Git Bash(默认的 pwsh 里敲 bash 可能落到 WSL)。
      - name: 测试
        working-directory: VelaShell
        shell: bash
        env:
          # 检出成功才指过去;失败时不设,文档比对用例照旧记为跳过(见上面那步的说明)。
          VELASHELL_DOCS_DIR: ${{ steps.docs.outcome == 'success' && format('{0}/velashell-docs', github.workspace) || '' }}
        run: ${{ matrix.launcher }} bash scripts/ci/run-tests.sh

      # Directory.Build.props 开着 runtime-async=on,而这个模式下编译器不报 CS4007:Span / ref struct 跨 await
      # 照常编译,await 真挂起之后那个 Span 回来是空的(根 AGENTS.md「几条会让你踩坑的硬约束」,plan.md §251)。
      # 关掉它再编一遍,报出来的 CS4007 就是这类代码 —— 测试抓不住它:await 同步完成时结果又是对的。
      #   * 只在 Linux 上跑:仓里没有 #if,所有工程都是同一个 net11.0(没有 -windows 目标、没有 WPF / WinForms),
      #     三个平台编到的源码一样,扫一个平台不漏,多扫两个只是多花两次全量编译。三个作业的时长差不多(7–10 分钟),
      #     加在哪个上都是拉长一次编译;Linux runner 的分钟计费倍率最低(Windows 2×、macOS 10×)。
      #   * 单独的 artifacts 路径:编到工作区外,不碰上面那次构建的 bin / obj,也不碰 artifacts/trx。
      #   * 测试红了也照扫(只要上面的构建过了):两件事互不相干,一次跑完都看得到。
      #   * Features 是整体覆盖:全局属性压过 Directory.Build.props 里的 $(Features);runtime-async=on。
      #     那里以后若加了别的 feature,这里要一并写上。
      #   * 不加 -warnaserror:警告由上面那次构建守着,这一步只管 runtime-async=off 下才报出来的错误。
      - name: 扫 Span 跨 await (runtime-async=off,CS4007)
        if: runner.os == 'Linux' && !cancelled() && steps.build.outcome == 'success'
        working-directory: VelaShell
        run: dotnet build VelaShell.slnx -c Debug --nologo --artifacts-path "${{ runner.temp }}/runtime-async-off" -p:Features=runtime-async=off

      # 失败也要传:-v 默认不打印失败用例名,trx 是唯一能定位到具体是哪一条的东西。
      # 偶发失败(见 plan-claude.md Q-06)就靠攒这些 trx 才有得查。
      # trx 里现在能分清「通过」与「未执行」,查"这条到底验没验过"不必再翻日志找 [SKIP]。
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-${{ matrix.os }}
          path: VelaShell/artifacts/trx/*.trx
          if-no-files-found: warn
