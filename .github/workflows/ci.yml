# PR / 推送门禁:构建 + 全量测试。发布流水线(release.yml)只在 publish Release 时跑,
# 在此之前没有任何自动检查 —— 包括 Dependabot 开的依赖升级 PR,合进来之前没人跑过一次测试。
#
# 几处刻意的选择,改之前先读:
#   * 用 **Debug**:强名签名只在 Release 打开(src/Directory.Build.props),Debug 不需要
#     VelaShell.snk。fork 与 Dependabot 的 PR 拿不到仓库 secret,用 Release 会直接构建失败。
#   * 排除 DockerIntegration / CrossPlatform / Interop:DockerIntegration 要 Docker 守护进程,
#     CrossPlatform 要 VELASHELL_PUBLISH_TESTS=1,Interop 要一台真 sshd
#     (由下面的 ssh-interop 作业起)。没有环境时它们会 Assert.Inconclusive(如实记为跳过),
#     在 CI 上跑一遍只是白花时间,不跑也不会掩盖什么。
#   * **本仓检出在 VelaShell/ 子目录**:文档仓库要与它并排(velashell-docs/),
#     快捷键总表与《快捷键参考》的比对用例才找得到。所以各步都带 working-directory。
#   * 矩阵带上 ubuntu:本进程内的 UI 测试走 Avalonia.Headless 不需要显示服务器,顺带把
#     #if LINUX 的 UseWayland 分支也编译到 —— 那段代码在 Windows 上永远编译不到,回归了
#     也看不见。唯一例外是隔离插件拉起的 PluginHost 子进程(见下方 matrix 的 launcher)。
#   * -warnaserror:当前基线就是 0 警告,守住它。
#   * **不加** dotnet format --verify-no-changes:CRLF 工作树与 end_of_line = lf 的
#     .editorconfig 会产生十几万条 ENDOFLINE 噪音,先把换行统一了再加这一步。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发:VelaShell.Ssh 的互操作矩阵(ssh-interop)不进 PR 门禁,想在分支上验一次时用它。
  workflow_dispatch:

# 同一分支上新推送会取消上一次还在跑的检查:PR 连推几次时不必把 runner 全占满。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 构建与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂掉不影响另一个继续跑完 —— 平台相关的回归要能一次看全。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            launcher: ""
          # 隔离插件测试要拉起真正的 PluginHost 子进程,那是个 Avalonia.Desktop 程序:
          # Linux 上 UsePlatformDetect 落到 X11,没有显示服务器就 XOpenDisplay failed
          # 直接 abort(退出码 134),插件连管道都来不及连。本进程内的 UI 测试走
          # Avalonia.Headless 不受影响,子进程不吃这套 —— 给它一块虚拟屏。
          - os: ubuntu-latest
            launcher: "xvfb-run -a"
          # macOS 上路径、进程与文件系统的行为都自成一套(大小写不敏感但保留大小写的卷、
          # 应用包结构、`open -a` 起编辑器、区分 /tmp 与 /private/tmp 的真实路径)。
          # release.yml 早就在 macos-latest 上完整构建并打包 osx-x64/osx-arm64,
          # 但那要等到 publish Release 才跑 —— 在此之前 macOS 上的回归无人拦截。
          # runner 是带图形会话的真机,PluginHost 子进程不需要额外的虚拟屏。
          - os: macos-latest
            launcher: ""
    steps:
      - uses: actions/checkout@v7
        with:
          path: VelaShell

      # 快捷键总表与文档仓库里那份《快捷键参考》要逐条对齐,把关的用例是
      # ShortcutCatalogTests.Doc_ListsEveryCatalogEntry —— 文档在另一个仓库,拿不到就
      # Assert.Inconclusive(如实记为跳过)。不检出它,这条用例在 CI 上永远不跑,
      # 那份文档里"由本用例把关"的承诺就是空的。
      #
      # continue-on-error:文档仓库私有、改名或临时不可达时,门禁不该因此拦下代码 PR。
      # 检出失败的后果是那条用例回到"跳过",报告里看得见 —— 不是伪通过。
      - name: 检出文档仓库
        id: docs
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: VelaShellLabs/velashell-docs
          path: velashell-docs

      # runner 镜像通常已带这些,列全是为了镜像换代时不至于悄悄少一个。
      #
      # 一个都不缺时**连 apt 都不碰**。镜像里还配着 Chrome 等第三方源,它们的索引偶尔会
      # Hash Sum mismatch,而 `apt-get update` 只要有一个源没取下来就整体退 100 ——
      # 本仓被它拦下过一次(run 34384262772:Linux 作业连编译都没跑到,见 plan.md §62)。
      # 真缺包时才更新索引,且更新失败只记一行:要装的包全在 Ubuntu 主仓,第三方源坏掉不该
      # 拦下代码 PR;真装不上的话,下面这条 install 会如实失败 —— 判据在装,不在索引。
      - name: 安装虚拟显示 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packages=(xvfb libx11-6 libice6 libsm6 libfontconfig1)
          missing=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed' || missing+=("$package")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "镜像已带齐:${packages[*]}"
            exit 0
          fi
          echo "缺少:${missing[*]}"
          sudo apt-get update || echo "::warning::apt-get update 有源没取下来,继续尝试安装。"
          sudo apt-get install -y --no-install-recommends "${missing[@]}"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: VelaShell/global.json

      - name: 构建
        working-directory: VelaShell
        run: dotnet build VelaShell.slnx -c Debug --nologo -warnaserror

      # 环境缺失的用例现在一律 Assert.Inconclusive(如实记为「跳过」),不再是
      # 「写一行 [SKIP] 日志然后 return」那种在报告里显示为通过的伪装。
      # 所以这里的过滤只是省时间,不再兼着"掩盖伪通过"的作用。
      - name: 测试
        working-directory: VelaShell
        env:
          # 检出成功才指过去;失败时不设,文档比对用例照旧记为跳过(见上面那步的说明)。
          VELASHELL_DOCS_DIR: ${{ steps.docs.outcome == 'success' && format('{0}/velashell-docs', github.workspace) || '' }}
        run: >
          ${{ matrix.launcher }}
          dotnet test VelaShell.slnx -c Debug --no-build --nologo
          --filter "TestCategory!=DockerIntegration&TestCategory!=CrossPlatform&TestCategory!=Interop"
          --logger "trx;LogFilePrefix=ci"
          --results-directory artifacts/trx

      # 失败也要传:-v 默认不打印失败用例名,trx 是唯一能定位到具体是哪一条的东西。
      # 偶发失败(见 plan-claude.md Q-06)就靠攒这些 trx 才有得查。
      # trx 里现在能分清「通过」与「未执行」,查"这条到底验没验过"不必再翻日志找 [SKIP]。
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-${{ matrix.os }}
          path: VelaShell/artifacts/trx/*.trx
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # VelaShell.Ssh 的专项门禁(库 2026-09-23 从 VelaShellLabs/velashell-ssh 并入,
  # 两条门禁随库一起搬过来)。库本身的构建与单元测试已经在上面的 test 作业里。
  #
  # 相似度门禁 —— src/VelaShell.Ssh/AGENTS.md §2 纪律 6。
  # 这是那个库的立身之本:任何人质疑「这是不是某个库的改名版」时,
  # 回答是「每次提交都自动比对,阈值在这,历史记录在这」。
  # **不要为了让 CI 过而放宽阈值。** 红了就去重写那一段。
  # ---------------------------------------------------------------------------
  ssh-checks:
    name: VelaShell.Ssh · 相似度门禁与严格校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # 压缩在 UseStrictValidation 打开时的行为。
      # 这一条进不了常规用例:那个 AppContext 开关只能在进程启动时设一次,
      # 而同进程并行的用例没法各设各的。所以单跑一个进程。
      - name: 压缩 · 严格校验开关
        run: dotnet run scripts/ssh/compression/verify-strict-validation.cs

      # 语料只活在 runner 的临时目录里,绝不进仓库。
      - name: 拉取比对语料
        run: dotnet run scripts/ssh/similarity-gate/similarity-gate.cs -- --fetch

      - name: 自检 —— 检测器对照抄必须报警
        # 拿语料当「我们的代码」比对它自己:如果这一步**通过**了,
        # 说明检测器坏了,后面那次真正的比对也就毫无意义。
        run: |
          set +e
          dotnet run scripts/ssh/similarity-gate/similarity-gate.cs -- \
            --ours scripts/ssh/similarity-gate/.corpus/tmds-ssh \
            --corpus scripts/ssh/similarity-gate/.corpus/tmds-ssh
          rc=$?
          set -e
          # 必须恰好是 1(「相似度超限」)。
          # 0 = 检测器对完全相同的源码没报警,门禁已失效。
          # 2 = 语料是空的 —— 那这一步根本没比对任何东西。
          if [ $rc -ne 1 ]; then
            echo "::error::自检失败(退出码 $rc,期望 1)。门禁不可信,拒绝继续。"
            exit 1
          fi
          echo "自检通过(检测器对照抄报警,退出码 1)。"

      - name: 比对 src/VelaShell.Ssh
        run: dotnet run scripts/ssh/similarity-gate/similarity-gate.cs

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ssh-similarity-report
          path: scripts/ssh/similarity-gate/.reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # VelaShell.Ssh 互操作矩阵(velashell-docs 仓库 zh/ssh/design/architecture.md §10.3)。
  #
  # 测试桩再全,也只能验证「我们对规范的理解与自己一致」。
  # 真正的坑在「OpenSSH 实际怎么做」与「规范怎么写」的差值里 ——
  # SFTP 的 SYMLINK 参数顺序就是最有名的一个。所以必须有真对端。
  #
  # 要起容器,慢且依赖网络,所以不进 PR 门禁 —— 只在 main 与手动触发时跑。
  # 用 Debug:Release 会强名签名,签名构建省略 InternalsVisibleTo,测试工程编不过。
  # ---------------------------------------------------------------------------
  ssh-interop:
    name: VelaShell.Ssh · 互操作 (${{ matrix.server }})
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          # 新版:后量子混合密钥交换、ML-KEM 都在这里才有。
          - server: openssh-current
            image: lscr.io/linuxserver/openssh-server:latest
          # 老版:验证我们没有默默依赖新算法 —— 真实世界里
          # 有大量停在几年前的设备。
          - server: openssh-9.3
            image: lscr.io/linuxserver/openssh-server:version-9.3_p2-r1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # -X11 会在容器里装 xauth 并打开 X11Forwarding。
      # 没有它的话 X11 那两条用例只会自报 Inconclusive。
      - name: 起 sshd
        run: pwsh scripts/ssh/interop/Start-TestServer.ps1 -Image "${{ matrix.image }}" -X11

      - name: 跑互操作用例
        env:
          VELASHELL_SSH_INTEROP: '1'
          VELASHELL_SSH_INTEROP_X11: '1'
          VELASHELL_SSH_INTEROP_HOST: 127.0.0.1
          VELASHELL_SSH_INTEROP_PORT: '2222'
          VELASHELL_SSH_INTEROP_USER: velashell
          VELASHELL_SSH_INTEROP_PASSWORD: velashell
          VELASHELL_SSH_INTEROP_KEY: ${{ github.workspace }}/artifacts/interop/id_ed25519
        run: >
          dotnet test tests/VelaShell.Ssh.Tests/VelaShell.Ssh.Tests.csproj -c Debug --nologo
          --filter "TestCategory=Interop"
          --logger "trx;LogFileName=interop-${{ matrix.server }}.trx"
          --results-directory ${{ github.workspace }}/artifacts/test-results

      - name: sshd 日志(失败时)
        if: failure()
        run: docker logs velashell-ssh-interop

      - name: 收掉 sshd
        if: always()
        run: pwsh scripts/ssh/interop/Stop-TestServer.ps1

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ssh-interop-results-${{ matrix.server }}
          path: artifacts/test-results
