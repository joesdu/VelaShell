<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 看板娘怀里那只黑猫玩偶的矢量徽标:墨黑头 + 青绿脸,右耳别 >_ 发卡,颈下铃铛。 -->
  <defs>
    <linearGradient id="clip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FE0B4" />
      <stop offset="1" stop-color="#10A887" />
    </linearGradient>
    <radialGradient id="bell" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#FFE9A3" />
      <stop offset=".45" stop-color="#F2C14E" />
      <stop offset="1" stop-color="#B8801C" />
    </radialGradient>
  </defs>

  <!-- 头 -->
  <path fill="#15191A"
    d="M38 120C38 80 48 46 60 28c5-8 14-8 20-2l30 32c12-4 24-5 36 0l30-32c6-6 15-6 20 2 12 18 22 52 22 92 0 62-40 98-90 98S38 182 38 120Z" />
  <!-- 内耳 -->
  <path fill="#0F3B34" d="M66 44l28 28c-12 6-22 14-30 24 0-20 0-36 2-52Z" />
  <path fill="#0F3B34" d="M190 44l-28 28c12 6 22 14 30 24 0-20 0-36-2-52Z" />

  <!-- 眼睛 -->
  <ellipse cx="94" cy="128" rx="9" ry="14" fill="#23D8AB" />
  <ellipse cx="162" cy="128" rx="9" ry="14" fill="#23D8AB" />
  <!-- ω 嘴 -->
  <path d="M112 152q8 11 16 0q8 11 16 0" fill="none" stroke="#23D8AB" stroke-width="5" stroke-linecap="round" />
  <!-- 胡须 -->
  <g stroke="#23D8AB" stroke-width="4" stroke-linecap="round" opacity=".85">
    <path d="M48 146l30 4" />
    <path d="M50 164l28-4" />
    <path d="M208 146l-30 4" />
    <path d="M206 164l-28-4" />
  </g>

  <!-- >_ 发卡 -->
  <g transform="rotate(14 196 58)">
    <rect x="172" y="34" width="48" height="48" rx="12" fill="url(#clip)" />
    <path d="M184 48l10 10-10 10" fill="none" stroke="#0B2A24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M198 69h12" stroke="#0B2A24" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- 铃铛 -->
  <path d="M100 206q28 10 56 0" fill="none" stroke="#1FB892" stroke-width="7" stroke-linecap="round" />
  <circle cx="128" cy="224" r="17" fill="url(#bell)" />
  <path d="M112 220q16 5 32 0" fill="none" stroke="#9A6A18" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="128" cy="230" r="3.5" fill="#7A5210" />
  <path d="M128 233v6" stroke="#7A5210" stroke-width="2.5" stroke-linecap="round" />
</svg>
